        <label>Tenure (months)</label>
        <input type="number" id="cr-int-tenure" placeholder="e.g. 12 — to calculate total interest">
      </div>
      <p class="small muted" id="int-summary" style="margin-top:-4px;padding:8px 10px;background:var(--surface-2);border-radius:8px;line-height:1.5"></p>
    </div>

    <div class="divider"></div>

    ${isTaken?`
    <!-- EMI toggle -->
    <label class="toggle-wrap" for="cr-emi">
      <div><div class="toggle-label">This is an EMI Loan</div><div class="toggle-sub">Fixed installments over a tenure</div></div>
      <div class="toggle"><input type="checkbox" id="cr-emi"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
    </label>
    <div id="emi-fields" style="display:none;margin-top:12px">
      <div class="field-row">
        <div class="field"><label>EMI Amount</label><input type="number" id="cr-emi-amt" placeholder="Monthly installment" inputmode="decimal"></div>
        <div class="field"><label>Tenure (months)</label><input type="number" id="cr-tenure" placeholder="e.g. 24"></div>
      </div>
      <div class="field"><label>EMI due day</label><input type="number" id="cr-emi-day" min="1" max="28" placeholder="Day of month, e.g. 5"></div>
      <p class="small muted" id="emi-auto-note" style="margin-top:-4px">Add interest above and enter tenure to auto-calculate the EMI, or type your own.</p>
      <p class="small muted" id="emi-total-summary" style="margin-top:4px;padding:8px 10px;background:var(--surface-2);border-radius:8px;line-height:1.5"></p>
    </div>`:''}

    <div class="field mt12"><label>Notes</label><textarea id="cr-notes" placeholder="Optional notes…"></textarea></div>
    <p class="small muted" style="margin-top:-4px">${isTaken?'Amount will be added to the selected account and logged as income.':'Amount will be deducted from the selected account and logged as an expense.'}</p>
    <button class="btn btn-primary btn-block mt16" id="cr-save">Save</button>`,
    root=>{
      root.querySelector('[data-x]').onclick = closeModal;

      // Interest toggle
      const hasIntChk = root.querySelector('#cr-has-interest');
      const intFields = root.querySelector('#interest-fields');
      hasIntChk.onchange = ()=>{ intFields.style.display = hasIntChk.checked?'block':'none'; updateIntSummary(); };

      // Interest type segmented control
      let intType = 'reducing';
      const intTypeDesc = root.querySelector('#int-type-desc');
      const intRateLabel = root.querySelector('#int-rate-label');
      root.querySelectorAll('[data-itype]').forEach(b=>b.onclick=()=>{
        intType = b.dataset.itype;
        root.querySelectorAll('[data-itype]').forEach(x=>x.classList.toggle('active', x===b));
        const found = INTEREST_TYPES.find(t=>t.id===intType);
        intTypeDesc.textContent = found ? found.sub : '';
        intRateLabel.textContent = intType==='flat_amount' ? 'Fixed Amount (₹)' : 'Rate (%)';
        root.querySelector('#cr-rate').placeholder = intType==='flat_amount' ? 'e.g. 500' : 'e.g. 12';
        const intTenureWrap = root.querySelector('#int-tenure-wrap');
        if(intTenureWrap) intTenureWrap.style.display = 'block';
        updateIntSummary();
      });

      function updateIntSummary(){
        const el = root.querySelector('#int-summary'); if(!el) return;
        if(!hasIntChk.checked){ el.innerHTML=''; return; }
        const rate = parseFloat(root.querySelector('#cr-rate').value)||0;
        const period = root.querySelector('#cr-int-period').value;
        const amt = parseFloat(root.querySelector('#cr-amt').value)||0;
        if(!rate){ el.innerHTML='Enter a rate to see summary.'; return; }
        const sym = CURRENCIES[DB.settings.currency]||'₹';
        const tenureEl = root.querySelector('#cr-int-tenure');
        const tenure = tenureEl ? (parseInt(tenureEl.value)||0) : 0;
        let desc = '';
        let totalLine = '';
        if(intType==='reducing'){
          desc = `${rate}% per ${period} on outstanding balance (reduces as you repay)`;
          if(amt>0 && tenure>0){
            const monthlyRate = period==='one-time' ? rate/tenure : rate/(MONTHS_PER_PERIOD[period]||1);
            const emi = calcEMI(amt, monthlyRate, tenure);
            const totalPayable = emi * tenure;
            const totalInterest = Math.max(totalPayable - amt, 0);
            totalLine = `<b style="color:var(--text)">Total = ${sym}${amt.toLocaleString('en-IN')} + ${sym}${totalInterest.toLocaleString('en-IN',{maximumFractionDigits:0})} interest = ${fmtMoney(totalPayable)}</b>`;
          } else if(amt>0){
            totalLine = `<span style="color:var(--text-dim)">Enter tenure to see total</span>`;
          }
        } else if(intType==='flat_rate'){
          desc = `${rate}% per ${period} on principal ${sym}${amt.toLocaleString('en-IN')} throughout the tenure`;
          if(amt>0){
            if(period==='one-time'){
              const interest = amt * rate / 100;
              totalLine = `<b style="color:var(--text)">Total = ${sym}${amt.toLocaleString('en-IN')} + ${sym}${interest.toLocaleString('en-IN',{maximumFractionDigits:2})} interest = ${fmtMoney(amt+interest)}</b>`;
            } else if(tenure>0){
              const periodsInTenure = tenure / (MONTHS_PER_PERIOD[period]||1);
              const interest = amt * rate / 100 * periodsInTenure;
              totalLine = `<b style="color:var(--text)">Total = ${sym}${amt.toLocaleString('en-IN')} + ${sym}${interest.toLocaleString('en-IN',{maximumFractionDigits:0})} interest = ${fmtMoney(amt+interest)}</b>`;
            } else {
              totalLine = `<span style="color:var(--text-dim)">Enter tenure to see total</span>`;
            }
          }
        } else if(intType==='flat_amount'){
          desc = `Fixed ${sym}${rate.toLocaleString('en-IN')} interest every ${period}`;
          if(amt>0){
            if(period==='one-time'){
              totalLine = `<b style="color:var(--text)">Total = ${sym}${amt.toLocaleString('en-IN')} + ${sym}${rate.toLocaleString('en-IN')} interest = ${fmtMoney(amt+rate)}</b>`;
            } else if(tenure>0){
              const periodsInTenure = tenure / (MONTHS_PER_PERIOD[period]||1);
              const interest = rate * periodsInTenure;
              totalLine = `<b style="color:var(--text)">Total = ${sym}${amt.toLocaleString('en-IN')} + ${sym}${interest.toLocaleString('en-IN',{maximumFractionDigits:0})} interest = ${fmtMoney(amt+interest)}</b>`;
            } else {
              totalLine = `<span style="color:var(--text-dim)">Enter tenure to see total</span>`;
            }
          }
        }
        el.innerHTML = desc + (totalLine ? `<br>${totalLine}` : '');
      }
      root.querySelector('#cr-rate').addEventListener('input', updateIntSummary);
      root.querySelector('#cr-int-period').addEventListener('change', ()=>{ updateIntSummary(); autoFillDueDate(); });
      root.querySelector('#cr-amt').addEventListener('input', updateIntSummary);
      root.querySelector('#cr-int-tenure').addEventListener('input', updateIntSummary);
      root.querySelector('#cr-date').addEventListener('change', ()=>{ autoFillDueDate(); });
      hasIntChk.addEventListener('change', ()=>{ autoFillDueDate(); });

      function autoFillDueDate(){
        if(!hasIntChk.checked) return;
        const period = root.querySelector('#cr-int-period').value;
        if(period==='one-time') return; // one-time: user sets the end date manually
        const startDate = root.querySelector('#cr-date').value || todayISO();
        const suggested = advanceDateByPeriod(startDate, period);
        const dueEl = root.querySelector('#cr-due');
        dueEl.value = suggested;
        // show a subtle hint below the due date field
        let hint = root.querySelector('#due-hint');
        if(!hint){
          hint = document.createElement('p');
          hint.id = 'due-hint';
          hint.className = 'small muted';
          hint.style.marginTop = '-6px';
          dueEl.parentNode.appendChild(hint);
        }
        const periodLabels = {daily:'day',weekly:'week',bimonthly:'2 weeks',monthly:'month',quarterly:'3 months',biannually:'6 months',annually:'year'};
        hint.textContent = `Auto-set to 1 ${periodLabels[period]||period} from start date. Tap to change.`;
      }

      // EMI toggle + auto-calculation from principal + interest + tenure
      const emiCheck = root.querySelector('#cr-emi');
      if(emiCheck) emiCheck.onchange = ()=>{
        root.querySelector('#emi-fields').style.display = emiCheck.checked?'block':'none';
        const dueLabel = root.querySelector('#cr-due-label');
        if(dueLabel) dueLabel.textContent = emiCheck.checked ? 'Loan end date (optional)' : 'Due date (optional)';
        if(emiCheck.checked){
          const dayEl = root.querySelector('#cr-emi-day');
          if(dayEl && !dayEl.value){
            const startDate = root.querySelector('#cr-date').value || todayISO();
            dayEl.value = Math.min(new Date(startDate+'T00:00:00').getDate(), 28);
          }
        }
        updateEmiSummary();
      };

      // How many months one interest "period" spans — used to convert the entered
      // rate/amount into a monthly-equivalent, since EMI tenure is always in months.
      const MONTHS_PER_PERIOD = {daily:1/30, weekly:7/30, bimonthly:14/30, monthly:1, quarterly:3, biannually:6, annually:12};

      function updateEmiSummary(){
        const totalEl = root.querySelector('#emi-total-summary');
        const noteEl = root.querySelector('#emi-auto-note');
        if(!totalEl || !(emiCheck && emiCheck.checked)) return;
        const principal = parseFloat(root.querySelector('#cr-amt').value)||0;
        const tenure = parseInt(root.querySelector('#cr-tenure').value)||0;
        if(!principal || !tenure){ totalEl.textContent=''; return; }
        let emi, totalPayable;
        if(hasIntChk.checked && parseFloat(root.querySelector('#cr-rate').value)>0){
          const rate = parseFloat(root.querySelector('#cr-rate').value)||0;
          const period = root.querySelector('#cr-int-period').value;
          // Number of times the entered rate/amount actually applies across the tenure.
          // "one-time" always applies exactly once, regardless of tenure length.
          const periodsInTenure = period==='one-time' ? 1 : tenure/(MONTHS_PER_PERIOD[period]||1);
          if(intType==='flat_amount'){
            totalPayable = principal + rate*periodsInTenure;
            emi = totalPayable/tenure;
          } else if(intType==='flat_rate'){
            totalPayable = principal + (principal*rate/100*periodsInTenure);
            emi = totalPayable/tenure;
          } else { // reducing — standard amortized EMI, using a month-equivalent rate
            const monthlyRate = period==='one-time' ? rate/tenure : rate/(MONTHS_PER_PERIOD[period]||1);
            emi = calcEMI(principal, monthlyRate, tenure);
            totalPayable = emi*tenure;
          }
          noteEl.textContent = `Auto-calculated from principal, interest and tenure (${rate}% per ${period} converted to a monthly rate) — edit if you want a different amount.`;
        } else {
          totalPayable = principal;
          emi = principal/tenure;
          noteEl.textContent = 'No interest set — EMI is principal split evenly across tenure. Edit if you want a different amount.';
        }
        root.querySelector('#cr-emi-amt').value = Math.round(emi*100)/100;
        const totalInterest = Math.max(totalPayable-principal,0);
        totalEl.textContent = `Total Amount (Principal + Interest): ${fmtMoney(totalPayable)}  ·  Interest: ${fmtMoney(totalInterest)}`;
      }
      const tenureEl0 = root.querySelector('#cr-tenure');
      if(tenureEl0) tenureEl0.addEventListener('input', ()=>{ updateEmiSummary(); updateIntSummary(); });
      root.querySelector('#cr-amt').addEventListener('input', updateEmiSummary);
      root.querySelector('#cr-rate').addEventListener('input', updateEmiSummary);
      root.querySelector('#cr-int-period').addEventListener('change', updateEmiSummary);
      hasIntChk.addEventListener('change', updateEmiSummary);
      root.querySelectorAll('[data-itype]').forEach(b=>b.addEventListener('click', updateEmiSummary));

      // Save
      root.querySelector('#cr-save').onclick = ()=>{
        const name = root.querySelector('#cr-name').value.trim();
        const amount = parseFloat(root.querySelector('#cr-amt').value)||0;
        if(!name){ toast('Enter a name'); return; }
        if(amount<=0){ toast('Enter a valid amount'); return; }
        const mobile = root.querySelector('#cr-mobile').value.trim();
        const date = root.querySelector('#cr-date').value||todayISO();
        const due = root.querySelector('#cr-due').value||'';
        const accountId = root.querySelector('#cr-account').value;
        const notes = root.querySelector('#cr-notes').value.trim();
        const txnId = genTxnId();
        const hasInterest = hasIntChk.checked;
        const rate = hasInterest ? (parseFloat(root.querySelector('#cr-rate').value)||0) : 0;
        const intPeriod = hasInterest ? root.querySelector('#cr-int-period').value : null;
        const interest = hasInterest ? { type: intType, rate, period: intPeriod } : null;

        if(isTaken){
          // Bug fix 3: emiCheck is always present for isTaken; use !! to guarantee boolean
          const isEMI = !!(emiCheck && emiCheck.checked);
          const emiAmount = isEMI ? (parseFloat(root.querySelector('#cr-emi-amt').value)||0) : null;
          const tenureMonths = isEMI ? (parseInt(root.querySelector('#cr-tenure').value)||0) : null;
          const emiDueDay = isEMI ? (parseInt(root.querySelector('#cr-emi-day').value)||0) : null;
          if(isEMI && (emiAmount<=0 || tenureMonths<=0)){ toast('Enter EMI amount and tenure'); return; }
          if(isEMI && (emiDueDay<1 || emiDueDay>28)){ toast('Enter a valid EMI due day (1–28)'); return; }
          DB.income.push({ id:uid(), type:'income', date, amount, accountId, category:'Credit Received', notes, tags:[], txnId,
            credit:{personName:name, mobile, dueDate:due, interest, paid:false, amountRepaid:0, pendingAmount:amount,
              isEMI, emiAmount, tenureMonths, emiDueDay, installmentsPaid:0} });
        } else {
          // Bug fix 3: Credit Given has no EMI concept — don't include isEMI at all
          DB.expense.push({ id:uid(), type:'expense', date, amount, accountId, category:'Credit Given', notes, tags:[], txnId,
            loan:{personName:name, mobile, dueDate:due, interest, amountReturned:0, pendingAmount:amount} });
        }
        saveDB(); closeModal(); toast('Saved'); render();
      };
    });
}
function openCreditDetail(direction, id){
  const isTaken = direction==='taken';
  // Re-fetch t fresh on each draw so edits are reflected
  function getT(){ return isTaken ? DB.income.find(x=>x.id===id) : DB.expense.find(x=>x.id===id); }
  function draw(){
    const t = getT(); if(!t){ closeModal(); return; }
    const info = isTaken ? t.credit : t.loan;
    const fin = creditFinancials(t, direction);
    const nextDue = creditNextDueDate(t, direction);
    const outstanding = fin.outstanding;
    const paidSoFar = fin.paidTotal;
    const defAcc = DB.settings.defaultAccount || (DB.accounts[0]&&DB.accounts[0].id);
    const payments = (info.payments||[]);
    const isEMI = isTaken && info.isEMI;
    const defaultPayAmt = isEMI ? Math.min(info.emiAmount||outstanding, outstanding) : outstanding;
    const hasInterest = !!info.interest || isEMI;
    const INT_TYPE_LABEL = {reducing:'Reducing Rate', flat_rate:'Flat Rate', flat_amount:'Flat Amount'};
    openModal(`
      <div class="modal-head"><h3>${esc(info.personName||'Unnamed')}</h3><button class="icon-btn" data-x>${ic('close')}</button></div>
      <p class="small muted" style="margin-top:-10px">${esc(t.txnId||'')}</p>
      <div class="grid grid-2">
        <div class="stat-card"><div class="label">Principal</div><div class="value num">${fmtMoney(t.amount)}</div></div>
        <div class="stat-card"><div class="label">Outstanding</div><div class="value num" style="color:${outstanding<=0.01?'var(--accent)':'var(--danger)'}">${outstanding<=0.01?'Settled':fmtMoney(outstanding)}</div></div>
        ${hasInterest?`<div class="stat-card"><div class="label">Interest ${isEMI?'(total)':'accrued'}</div><div class="value num">${fmtMoney(fin.interestAccrued)}</div></div>
        <div class="stat-card"><div class="label">Total Amount</div><div class="value num">${fmtMoney(fin.totalAmount)}</div></div>`:''}
      </div>
      ${isEMI?`<div class="grid grid-2 mt8">
        <div class="stat-card"><div class="label">EMIs Paid</div><div class="value num">${info.installmentsPaid||0} / ${info.tenureMonths}</div></div>
        <div class="stat-card"><div class="label">EMI Amount</div><div class="value num">${fmtMoney(info.emiAmount)}</div></div>
      </div>`:''}
      <div class="card-flat mt12">
        <div class="flex-between small"><span class="muted">${isTaken?'Lender':'Borrower'}</span><b>${esc(info.personName||'—')}</b></div>
        ${info.mobile?`<div class="flex-between small mt8"><span class="muted">Mobile</span><b>${esc(info.mobile)}</b></div>`:''}
        ${info.interest?(()=>{
          const it = info.interest;
          const rateLabel = it.type==='flat_amount' ? fmtMoney(it.rate) : `${it.rate}%`;
          return `<div class="flex-between small mt8"><span class="muted">Interest</span><b>${rateLabel} · ${INT_TYPE_LABEL[it.type]||it.type} · per ${it.period}</b></div>`;
        })():''}
        ${isEMI?`<div class="flex-between small mt8"><span class="muted">Tenure</span><b>${info.tenureMonths} months</b></div>`:''}
        ${isEMI?`
        <div class="flex-between small mt8"><span class="muted">Next EMI due${info.emiDueDay?` · day ${info.emiDueDay} of month`:''}</span><b>${nextDue?fmtDate(nextDue):'—'}</b></div>
        <div class="flex-between small mt8"><span class="muted">Loan end date</span><b>${info.dueDate?fmtDate(info.dueDate):'—'}</b></div>`
        :`<div class="flex-between small mt8"><span class="muted">Due date${info.interest&&info.interest.period&&info.interest.period!=='one-time'?` · every ${info.interest.period}`:''}</span><b>${info.dueDate?fmtDate(info.dueDate):'—'}</b></div>`}
        <div class="flex-between small mt8"><span class="muted">${isTaken?'Repaid so far':'Recovered so far'}</span><b>${fmtMoney(paidSoFar)}</b></div>
        ${hasInterest && !isEMI ? `<div class="flex-between small mt8"><span class="muted">Total (Principal + Interest)</span><b>${fmtMoney(fin.totalAmount)}</b></div>` : ''}
      </div>

      ${payments.length?`
        <div class="section-title"><h3>Payment history</h3></div>
        <div class="card" id="cr-pay-hist">
          ${payments.map((p,pi)=>`
            <div class="flex-between small" style="padding:8px 0;border-bottom:1px solid var(--border)">
              <span>${fmtDate(p.date)} · ${esc(accName(p.accountId))}</span>
              <div style="display:flex;align-items:center;gap:8px">
                <b class="num">${fmtMoney(p.amount)}</b>
                <button class="icon-btn" style="width:28px;height:28px;border-radius:8px" data-edit-pay="${pi}" title="Edit">${ic('edit')}</button>
                <button class="icon-btn" style="width:28px;height:28px;border-radius:8px;color:var(--danger)" data-del-pay="${pi}" title="Delete">${ic('trash')}</button>
              </div>
            </div>`).join('')}
        </div>`:''}

      ${outstanding>0.01?`
        <div class="divider"></div>
        <b class="small">Record ${isEMI?'EMI':'a '+(isTaken?'repayment':'collection')}</b>
        <div class="field mt8"><label>Amount</label><input type="number" id="cr-pay-amt" value="${defaultPayAmt}" max="${outstanding}"></div>
        <div class="field"><label>${isTaken?'Pay from':'Receive into'} account</label><select id="cr-pay-account">${DB.accounts.map(a=>`<option value="${a.id}" ${a.id===defAcc?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Date</label><input type="date" id="cr-pay-date" value="${todayISO()}"></div>
        <button class="btn btn-primary btn-block mt8" id="cr-pay-save">Record ${isEMI?'EMI Payment':(isTaken?'Repayment':'Collection')}</button>`:''}

      <div class="btn-row mt12">
        <button class="btn btn-ghost" style="flex:1" id="cr-edit">${ic('edit')} Edit</button>
        ${outstanding>0.01?`<button class="btn btn-ghost" style="flex:1;color:var(--accent)" id="cr-settle">✅ Mark Settled</button>`:''}
        <button class="btn btn-ghost" style="flex:1;color:var(--danger)" id="cr-delete">${ic('trash')}</button>
      </div>`,
      root=>{
        root.querySelector('[data-x]').onclick = closeModal;

        // ── Record payment ──
        const payBtn = root.querySelector('#cr-pay-save');
        if(payBtn) payBtn.onclick = ()=>{
          const t2 = getT(); if(!t2) return;
          const info2 = isTaken ? t2.credit : t2.loan;
          const fin2 = creditFinancials(t2, direction);
          let amt = parseFloat(root.querySelector('#cr-pay-amt').value)||0;
          if(amt<=0){ toast('Enter a valid amount'); return; }
          if(amt>fin2.outstanding){ toast(`Amount exceeds outstanding (${fmtMoney(fin2.outstanding)})`); return; }
          const accountId = root.querySelector('#cr-pay-account').value;
          const date = root.querySelector('#cr-pay-date').value||todayISO();
          if(date < t2.date){ toast('Payment date cannot be before the credit start date'); return; }
          const payTxnId = genTxnId();
          if(isTaken){
            const repayCat = ensureCategory('categoriesExpense', isEMI?'EMI':'Credit Repayment', '🏦', '#F43F5E');
            DB.expense.push({ id:uid(), type:'expense', date, amount:amt, accountId, category:repayCat, notes:`${isEMI?'EMI':'Repayment'} to ${info2.personName}`, tags:[], txnId:payTxnId, linkedCreditId:id });
            info2.payments = [...(info2.payments||[]), {date, amount:amt, accountId, txnId:payTxnId}];
            const uf = creditFinancials(t2, 'taken');
            info2.paid = uf.settled; info2.amountRepaid = uf.paidTotal; info2.pendingAmount = uf.outstanding;
            if(isEMI){
              // Next EMI due date is derived from emiDueDay + installmentsPaid (see
              // creditNextDueDate) — no date field to advance here anymore.
              info2.installmentsPaid = (info2.installmentsPaid||0)+1;
            }
          } else {
            const repayCat = ensureCategory('categoriesIncome','Credit Repayment','🏦','#10B981');
            DB.income.push({ id:uid(), type:'income', date, amount:amt, accountId, category:repayCat, notes:`Repayment from ${info2.personName}`, tags:[], txnId:payTxnId, linkedCreditId:id });
            info2.payments = [...(info2.payments||[]), {date, amount:amt, accountId, txnId:payTxnId}];
            const uf = creditFinancials(t2, 'given');
            info2.amountReturned = uf.paidTotal; info2.pendingAmount = uf.outstanding;
          }
          saveDB(); toast('Recorded'); draw();
        };

        // ── Per-payment delete ──
        root.querySelectorAll('[data-del-pay]').forEach(btn=>btn.onclick=async ()=>{
          const pi = parseInt(btn.dataset.delPay);
          const t2 = getT(); if(!t2) return;
          const info2 = isTaken ? t2.credit : t2.loan;
          const p = (info2.payments||[])[pi]; if(!p) return;
          const ok = await confirmDialog('Delete this payment?',`${fmtDate(p.date)} · ${fmtMoney(p.amount)} — this will also remove the linked repayment transaction.`,'Delete');
          if(!ok) return;
          // Remove from payments[]
          info2.payments.splice(pi,1);
          // Remove linked repayment tx
          if(p.txnId){
            if(isTaken) DB.expense = DB.expense.filter(x=>x.txnId!==p.txnId);
            else DB.income = DB.income.filter(x=>x.txnId!==p.txnId);
          }
          // Recalculate derived fields
          const uf = creditFinancials(t2, direction);
          if(isTaken){ info2.paid=uf.settled; info2.amountRepaid=uf.paidTotal; info2.pendingAmount=uf.outstanding; }
          else { info2.amountReturned=uf.paidTotal; info2.pendingAmount=uf.outstanding; }
          saveDB(); toast('Payment deleted'); draw();
        });

        // ── Per-payment edit ──
        root.querySelectorAll('[data-edit-pay]').forEach(btn=>btn.onclick=()=>{
          const pi = parseInt(btn.dataset.editPay);
          const t2 = getT(); if(!t2) return;
          const info2 = isTaken ? t2.credit : t2.loan;
          const p = (info2.payments||[])[pi]; if(!p) return;
          openModal(`
            <div class="modal-head"><h3>Edit Payment</h3><button class="icon-btn" data-x2>${ic('close')}</button></div>
            <div class="field"><label>Amount</label><input type="number" id="ep-amt" value="${p.amount}"></div>
            <div class="field"><label>Date</label><input type="date" id="ep-date" value="${p.date}"></div>
            <div class="field"><label>Account</label><select id="ep-acc">${DB.accounts.map(a=>`<option value="${a.id}" ${a.id===p.accountId?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div>
            <button class="btn btn-primary btn-block mt12" id="ep-save">Save</button>`,
            r2=>{
              r2.querySelector('[data-x2]').onclick = ()=>draw();
              r2.querySelector('#ep-save').onclick = ()=>{
                const newAmt = parseFloat(r2.querySelector('#ep-amt').value)||0;
                if(newAmt<=0){ toast('Enter a valid amount'); return; }
                const newDate = r2.querySelector('#ep-date').value||p.date;
                if(newDate < t2.date){ toast('Date cannot be before credit start date'); return; }
                const newAccId = r2.querySelector('#ep-acc').value;
                // Update payment entry
                p.amount = newAmt; p.date = newDate; p.accountId = newAccId;
                // Update linked repayment tx if exists
                if(p.txnId){
                  const arr2 = isTaken ? DB.expense : DB.income;
                  const lx = arr2.find(x=>x.txnId===p.txnId);
                  if(lx){ lx.amount=newAmt; lx.date=newDate; lx.accountId=newAccId; }
                }
                // Recalculate derived fields
                const uf = creditFinancials(t2, direction);
                if(isTaken){ info2.paid=uf.settled; info2.amountRepaid=uf.paidTotal; info2.pendingAmount=uf.outstanding; }
                else { info2.amountReturned=uf.paidTotal; info2.pendingAmount=uf.outstanding; }
                saveDB(); toast('Payment updated'); draw();
              };
            });
        });

        // ── Mark fully settled ──
        const settleBtn = root.querySelector('#cr-settle');
        if(settleBtn) settleBtn.onclick = async ()=>{
          const ok = await confirmDialog('Mark as Settled?','This records the full outstanding amount as a final repayment right now.','Mark Settled');
          if(!ok) return;
          const t2 = getT(); if(!t2) return;
          const info2 = isTaken ? t2.credit : t2.loan;
          const fin2 = creditFinancials(t2, direction);
          const remaining = fin2.outstanding;
          if(remaining<=0.01){ toast('Already settled'); draw(); return; }
          const payTxnId = genTxnId();
          if(isTaken){
            const repayCat = ensureCategory('categoriesExpense','Credit Repayment','🏦','#F43F5E');
            DB.expense.push({ id:uid(), type:'expense', date:todayISO(), amount:remaining, accountId:defAcc, category:repayCat, notes:`Settled · ${info2.personName}`, tags:[], txnId:payTxnId, linkedCreditId:id });
            info2.payments = [...(info2.payments||[]), {date:todayISO(), amount:remaining, accountId:defAcc, txnId:payTxnId}];
            info2.paid=true; info2.amountRepaid=(info2.amountRepaid||0)+remaining; info2.pendingAmount=0;
          } else {
            const repayCat = ensureCategory('categoriesIncome','Credit Repayment','🏦','#10B981');
            DB.income.push({ id:uid(), type:'income', date:todayISO(), amount:remaining, accountId:defAcc, category:repayCat, notes:`Settled · ${info2.personName}`, tags:[], txnId:payTxnId, linkedCreditId:id });
            info2.payments = [...(info2.payments||[]), {date:todayISO(), amount:remaining, accountId:defAcc, txnId:payTxnId}];
            info2.amountReturned=(info2.amountReturned||0)+remaining; info2.pendingAmount=0;
          }
          saveDB(); toast('Marked as settled'); draw();
        };

        // ── Edit credit record ──
        root.querySelector('#cr-edit').onclick = ()=>{
          const t2 = getT(); if(!t2) return;
          const info2 = isTaken ? t2.credit : t2.loan;
          openModal(`
            <div class="modal-head"><h3>Edit ${isTaken?'Credit Taken':'Credit Given'}</h3><button class="icon-btn" data-xe>${ic('close')}</button></div>
            <div class="field-row">
              <div class="field"><label>${isTaken?"Lender's":"Borrower's"} name</label><input type="text" id="ce-name" value="${esc(info2.personName||'')}"></div>
              <div class="field"><label>Mobile (optional)</label><input type="tel" id="ce-mobile" value="${esc(info2.mobile||'')}"></div>
            </div>
            <div class="field"><label>${isEMI?'Loan end date':'Due date'}</label><input type="date" id="ce-due" value="${info2.dueDate||''}"></div>
            <div class="field"><label>Notes</label><textarea id="ce-notes">${esc(t2.notes||'')}</textarea></div>
            ${isEMI?`<div class="field-row">
              <div class="field"><label>EMI Amount</label><input type="number" id="ce-emi-amt" value="${info2.emiAmount||''}"></div>
              <div class="field"><label>Tenure (months)</label><input type="number" id="ce-tenure" value="${info2.tenureMonths||''}"></div>
            </div>
            <div class="field"><label>EMI due day</label><input type="number" id="ce-emi-day" min="1" max="28" value="${info2.emiDueDay||''}"></div>`:''}
            <button class="btn btn-primary btn-block mt16" id="ce-save">Save Changes</button>`,
            re=>{
              re.querySelector('[data-xe]').onclick = ()=>draw();
              re.querySelector('#ce-save').onclick = ()=>{
                const name = re.querySelector('#ce-name').value.trim();
                if(!name){ toast('Enter a name'); return; }
                info2.personName = name;
                info2.mobile = re.querySelector('#ce-mobile').value.trim();
                info2.dueDate = re.querySelector('#ce-due').value||'';
                t2.notes = re.querySelector('#ce-notes').value.trim();
                if(isEMI){
                  const newEmi = parseFloat(re.querySelector('#ce-emi-amt').value)||info2.emiAmount;
                  const newTenure = parseInt(re.querySelector('#ce-tenure').value)||info2.tenureMonths;
                  const newDay = parseInt(re.querySelector('#ce-emi-day').value);
                  info2.emiAmount = newEmi; info2.tenureMonths = newTenure;
                  if(newDay>=1 && newDay<=28) info2.emiDueDay = newDay;
                }
                saveDB(); toast('Updated'); draw();
              };
            });
        };

        // ── Delete record ──
        root.querySelector('#cr-delete').onclick = async ()=>{
          const ok = await confirmDialog('Delete this record?','This removes the credit entry and all linked repayment/collection transactions.','Delete');
          if(!ok) return;
          const arr = isTaken?DB.income:DB.expense;
          const idx = arr.findIndex(x=>x.id===id); if(idx>-1) arr.splice(idx,1);
          if(isTaken) DB.expense = DB.expense.filter(x=>x.linkedCreditId!==id);
          else DB.income = DB.income.filter(x=>x.linkedCreditId!==id);
          saveDB(); closeModal(); toast('Deleted'); render();
        };
      });
  }
  draw();
}

      };
    });
}

function computeCAGR(inv){
  const days = daysBetween(inv.purchaseDate, todayISO());
  if(days<=0 || !inv.investedAmount) return null;
  const ratio = (Number(inv.currentValue)||0)/Number(inv.investedAmount);
  if(ratio<=0) return null;
  const years = days/365;
  return (Math.pow(ratio, 1/years)-1)*100;
}
function openInvestModal(id){
  if(!requireSignedIn(id ? null : 'invest')) return;
  const isEdit=!!id;
  const inv = isEdit? DB.investments.find(i=>i.id===id) : {id:uid(), name:'', category:INVESTMENT_CATS[0], purchaseDate:todayISO(), purchasePrice:null, quantity:'', investedAmount:'', currentValue:'', notes:'', history:[]};

    <div class="field"><label>Investment name</label><input type="text" id="i-name" value="${esc(inv.name)}" placeholder="e.g. Nifty 50 Index Fund"></div>

    <div class="field-row"><div class="field"><label>Invested amount</label><input type="number" id="i-invested" value="${inv.investedAmount}" ${isEdit?'disabled':''}></div><div class="field"><label>Quantity (optional)</label><input type="number" id="i-qty" value="${inv.quantity||''}"></div></div>
    ${!isEdit?`<div class="field"><label>Pay from</label><select id="i-account">${DB.accounts.map(a=>`<option value="${a.id}" ${a.id===defAcc?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div>
    <p class="small muted" style="margin-top:-8px">This amount will be deducted from the selected account and logged as an expense.</p>`:''}
    <div class="field"><label>Current value</label><input type="number" id="i-current" value="${inv.currentValue}"></div>
    <div class="field"><label>Notes</label><textarea id="i-notes">${esc(inv.notes||'')}</textarea></div>
    ${isEdit?`<div class="card-flat mt12"><div class="flex-between small"><span class="muted">CAGR (est.)</span><b>${(()=>{const c=computeCAGR(inv); return c==null?'—':c.toFixed(1)+'%';})()}</b></div></div>`:''}
    <div class="btn-row mt16">${isEdit?`<button class="btn btn-danger" id="i-del">${ic('trash')} Delete</button><button class="btn" id="i-withdraw">${ic('download')} Withdraw</button>`:''}<button class="btn btn-primary" style="flex:1" id="i-save">Save</button></div>`,
    root=>{
      root.querySelector('[data-x]').onclick = closeModal;
      if(isEdit) root.querySelector('#i-del').onclick = async ()=>{
        const linkedExp = DB.expense.filter(t=>t.id===inv.linkedExpenseId || t.linkedInvestmentId===id);
        const linkedInc = DB.income.filter(t=>t.linkedInvestmentId===id);
        const n = linkedExp.length + linkedInc.length;
        const msg = n>0
          ? `This removes the holding record and its ${n} linked transaction${n>1?'s':''} (purchase${linkedInc.length?' and withdrawal':''} entries). This cannot be undone.`
          : 'This removes the holding record. No linked transactions were found.';
        const ok = await confirmDialog('Delete investment?', msg, 'Delete'); if(!ok) return;
        DB.expense = DB.expense.filter(t=>t.id!==inv.linkedExpenseId && t.linkedInvestmentId!==id);
        DB.income = DB.income.filter(t=>t.linkedInvestmentId!==id);
        DB.investments = DB.investments.filter(i=>i.id!==id);
        saveDB(); closeModal(); toast('Investment and linked transactions deleted'); render();
      };
      if(isEdit) root.querySelector('#i-withdraw').onclick = ()=>{ closeModal(); openWithdrawModal(id); };
      root.querySelector('#i-save').onclick = ()=>{
        const name = root.querySelector('#i-name').value.trim();
        const currentValue = parseFloat(root.querySelector('#i-current').value)||0;
        const investedAmount = parseFloat(root.querySelector('#i-invested').value)||0;
        if(!name){ toast('Enter a name'); return; }
        if(!isEdit && investedAmount<=0){ toast('Enter the invested amount'); return; }
        const category = root.querySelector('#i-cat').value;
        const purchaseDate = isEdit ? inv.purchaseDate : (root.querySelector('#i-date').value||todayISO());
        let linkedExpenseId = inv.linkedExpenseId, txnId = inv.txnId;
        if(!isEdit){
          const accId = root.querySelector('#i-account').value;
          const expCatName = ensureCategory('categoriesExpense', INVEST_CAT_EXPENSE[category]||'Investment', '📈', '#10B981');
          txnId = genTxnId();
          const expTx = { id:uid(), type:'expense', date:purchaseDate, amount:investedAmount, accountId:accId, category:expCatName,
            notes:`Investment: ${name}`, tags:[], linkedInvestmentId: inv.id, txnId };
          DB.expense.push(expTx);
          linkedExpenseId = expTx.id;
        }
        const newInv = {
          id: inv.id, name, category, purchaseDate,
          investedAmount, quantity: parseFloat(root.querySelector('#i-qty').value)||null,
          currentValue, purchasePrice: inv.purchasePrice, notes: root.querySelector('#i-notes').value.trim(),
          history:[...(inv.history||[]), {date:todayISO(), value:currentValue}], linkedExpenseId, txnId
        };
        const idx = DB.investments.findIndex(i=>i.id===inv.id);
        if(idx>-1) DB.investments[idx]=newInv; else DB.investments.push(newInv);
        saveDB(); closeModal(); toast('Saved'); render();
      };
    });
}
function openWithdrawModal(id){
  const inv = DB.investments.find(i=>i.id===id); if(!inv) return;
  const defAcc = DB.settings.defaultAccount || (DB.accounts[0]&&DB.accounts[0].id);
  const curVal = Number(inv.currentValue)||0;
  openModal(`
    <div class="modal-head"><h3>Withdraw · ${esc(inv.name)}</h3><button class="icon-btn" data-x>${ic('close')}</button></div>
    <p class="small muted">Current value: <b class="num">${fmtMoney(curVal)}</b>. Withdrawing moves this amount to an account and records it as income.</p>
    <div class="field"><label>Withdraw amount</label><input type="number" id="w-amt" value="${curVal}" max="${curVal}"></div>
    <div class="field"><label>To account</label><select id="w-account">${DB.accounts.map(a=>`<option value="${a.id}" ${a.id===defAcc?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Date</label><input type="date" id="w-date" value="${todayISO()}"></div>
    <button class="btn btn-primary btn-block mt16" id="w-save">Withdraw</button>`,
    root=>{
      root.querySelector('[data-x]').onclick = closeModal;
      root.querySelector('#w-save').onclick = ()=>{
        let amt = parseFloat(root.querySelector('#w-amt').value)||0;
        if(amt<=0){ toast('Enter a valid amount'); return; }
        if(amt>curVal) amt = curVal;
        const accId = root.querySelector('#w-account').value;
        const date = root.querySelector('#w-date').value||todayISO();
        const fraction = curVal>0 ? amt/curVal : 1;
        const investedPortion = (Number(inv.investedAmount)||0)*fraction;
        const realizedPL = amt-investedPortion;
        const incCatName = ensureCategory('categoriesIncome', INVEST_CAT_INCOME[inv.category]||'Investment Profit', '💰', '#10B981');
        const wTxnId = genTxnId();
        DB.income.push({ id:uid(), type:'income', date, amount:amt, accountId:accId, category:incCatName,
          notes:`Withdrawal: ${inv.name}`, tags:[], linkedInvestmentId: inv.id, realizedPL, txnId:wTxnId });
        const newCurrentValue = Math.max(curVal-amt,0);
        const newInvestedAmount = Math.max((Number(inv.investedAmount)||0)-investedPortion,0);
        const idx = DB.investments.findIndex(i=>i.id===id);
        DB.investments[idx] = { ...inv, currentValue:newCurrentValue, investedAmount:newInvestedAmount,
          closed: newCurrentValue<=0.01, history:[...(inv.history||[]), {date, value:newCurrentValue, event:'withdrawal', amount:amt}] };
        saveDB(); closeModal(); toast('Withdrawn'); render();
      };
    });
}

  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit':'Add'} Account</h3><button class="icon-btn" data-x>${ic('close')}</button></div>
    <div class="field-row"><div class="field" style="max-width:70px"><label>Icon</label><input type="text" id="a-icon" maxlength="2" value="${esc(a.icon)}"></div><div class="field" style="flex:1"><label>Name</label><input type="text" id="a-name" value="${esc(a.name)}" placeholder="e.g. HDFC Savings"></div></div>
    <div class="field"><label>Type</label><select id="a-type"><option value="cash" ${a.type==='cash'?'selected':''}>Cash</option><option value="bank" ${a.type==='bank'?'selected':''}>Bank Account</option><option value="wallet" ${a.type==='wallet'?'selected':''}>Wallet (Paytm/PhonePe/GPay etc.)</option></select></div>
    <div class="field"><label>Opening balance</label><input type="number" id="a-opening" value="${a.openingBalance||0}"></div>
    <div class="field"><label>Color</label><div class="swatch-row">${ACCOUNT_COLORS.map(c=>`<button class="swatch ${c===a.color?'selected':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div></div>
    <div class="btn-row mt16">${isEdit?`<button class="btn btn-danger" id="a-del">${ic('trash')} Delete</button>`:''}<button class="btn btn-primary" style="flex:1" id="a-save">Save</button></div>`,
    root=>{
      let color=a.color;
      root.querySelector('[data-x]').onclick = closeModal;
      root.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color; root.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b));});
      if(isEdit) root.querySelector('#a-del').onclick = async ()=>{
        if(DB.accounts.length<=1){ toast('You need at least one account'); return; }
        const inUse = DB.income.some(t=>t.accountId===id) || DB.expense.some(t=>t.accountId===id);
        if(inUse){ toast('Account has transactions — cannot delete'); return; }
        const ok = await confirmDialog('Delete account?','This cannot be undone.','Delete'); if(!ok) return;
        DB.accounts = DB.accounts.filter(x=>x.id!==id); saveDB(); closeModal(); toast('Deleted'); render();
      };
      root.querySelector('#a-save').onclick = ()=>{
        const name = root.querySelector('#a-name').value.trim();
        if(!name){ toast('Enter account name'); return; }
        const newA = {id:a.id, name, type:root.querySelector('#a-type').value, icon:root.querySelector('#a-icon').value.trim()||'🏦', color, openingBalance:parseFloat(root.querySelector('#a-opening').value)||0};
        const idx = DB.accounts.findIndex(x=>x.id===a.id);
        if(idx>-1) DB.accounts[idx]=newA; else DB.accounts.push(newA);
        saveDB(); closeModal(); toast('Saved'); render();
      };
    });
}

  <div id="report-body"></div>`;
}
function filterByRange(list, range, from, to){
  const now = new Date();
  return list.filter(t=>{
    const d = new Date(t.date);
    if(range==='week'){ const diff=(now-d)/86400000; return diff<=7 && diff>=0; }
    if(range==='month') return monthKey(t.date)===monthKey(todayISO());
    if(range==='quarter'){
      const q = Math.floor(now.getMonth()/3), dq = Math.floor(d.getMonth()/3);
      return d.getFullYear()===now.getFullYear() && dq===q;
    }
    if(range==='year') return t.date.slice(0,4)===todayISO().slice(0,4);
    if(range==='custom'){ if(!from||!to) return true; return t.date>=from && t.date<=to; }
    return true;
  });
}

function openSearch(){
  openModal(`
    <div class="modal-head"><h3>Search FinPlan</h3><button class="icon-btn" data-x>${ic('close')}</button></div>
    <div class="searchbar">${ic('search')}<input type="text" id="gs-input" placeholder="Search transactions, categories, banks, people…" autofocus></div>
    <div class="mt12" id="gs-results"></div>`,
    root=>{
      root.querySelector('[data-x]').onclick = closeModal;
      const input = root.querySelector('#gs-input');
      const resEl = root.querySelector('#gs-results');
      function run(){
        const q = input.value.trim().toLowerCase();
        if(!q){ resEl.innerHTML=''; return; }
        const results=[];
        DB.income.forEach(t=>{ if(matchTx(t,q)) results.push({...t,type:'income'}); });
        DB.expense.forEach(t=>{ if(matchTx(t,q)) results.push({...t,type:'expense'}); });
        DB.investments.forEach(i=>{ if((i.name+i.category+(i.notes||'')).toLowerCase().includes(q)) results.push({kind:'inv',...i}); });
        DB.accounts.forEach(a=>{ if(a.name.toLowerCase().includes(q)) results.push({kind:'acc',...a}); });
        resEl.innerHTML = results.length? results.slice(0,20).map(r=>{
          if(r.kind==='inv') return `<div class="tx-row" data-r-inv="${r.id}"><div class="tx-icon" style="background:var(--accent-2)22;color:var(--accent-2)">📊</div><div class="tx-mid"><div class="t1">${esc(r.name)}</div><div class="t2">Investment · ${esc(r.category)}</div></div></div>`;
          if(r.kind==='acc') return `<div class="tx-row" data-r-acc="${r.id}"><div class="tx-icon" style="background:${r.color}22;color:${r.color}">${r.icon}</div><div class="tx-mid"><div class="t1">${esc(r.name)}</div><div class="t2">Account · ${r.type}</div></div></div>`;
          return txRowHtml(r);
        }).join('') : `<p class="muted small center mt16">No matches</p>`;
        resEl.querySelectorAll('[data-open-tx]').forEach(b=>b.onclick=()=>{ const [ty,id]=b.dataset.openTx.split(':'); closeModal(); openTxModal(ty,id); });
        resEl.querySelectorAll('[data-r-inv]').forEach(b=>b.onclick=()=>{ closeModal(); openInvestModal(b.dataset.rInv); });
        resEl.querySelectorAll('[data-r-acc]').forEach(b=>b.onclick=()=>{ closeModal(); navigate('accounts'); });
      }
      input.addEventListener('input', debounce(run,150));
    });
}
function matchTx(t,q){
  return t.category.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q) ||
    (t.tags||[]).some(tg=>tg.toLowerCase().includes(q)) || accName(t.accountId).toLowerCase().includes(q) ||
    (t.credit&&(t.credit.personName||'').toLowerCase().includes(q)) || (t.loan&&(t.loan.personName||'').toLowerCase().includes(q));
}

    toast('Backup exported');
  };
  document.getElementById('imp-json').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.accounts || !parsed.settings){ toast('Invalid backup file'); return; }
        const ok = await confirmDialog('Restore backup?', 'This replaces all current data on this device with the backup file.', 'Restore');
        if(!ok) return;
        DB = Object.assign(defaultDB(), parsed);
        saveDB(); applyTheme(); buildSidebar(); buildBottomNav(); navigate('dashboard'); toast('Backup restored');
      }catch(err){ toast('Could not read file'); }
    };
    reader.readAsText(file);
  });
  document.getElementById('exp-csv').onclick = exportCSV;
  document.getElementById('exp-pdf').onclick = exportPDF;
  document.getElementById('reset-app').onclick = async ()=>{
    const ok = await confirmDialog('Erase everything?', 'All accounts, transactions and settings on this device will be permanently deleted.', 'Erase');
    if(!ok) return;
    localStorage.removeItem(DB_KEY); DB = defaultDB(); saveDB(); applyTheme(); buildSidebar(); buildBottomNav(); navigate('dashboard'); toast('App reset');
  };
}
function csvEscape(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCSV(){
  const rows = [['Type','Date','Amount','Category','Account','Notes','Tags','Person','Mobile','DueDate']];
  DB.income.forEach(t=>rows.push(['Income',t.date,t.amount,t.category,accName(t.accountId),t.notes||'',(t.tags||[]).join('|'),t.credit?.personName||'',t.credit?.mobile||'',t.credit?.dueDate||'']));
  DB.expense.forEach(t=>rows.push(['Expense',t.date,t.amount,t.category,accName(t.accountId),t.notes||'',(t.tags||[]).join('|'),t.loan?.personName||'',t.loan?.mobile||'',t.loan?.dueDate||'']));
  DB.investments.forEach(i=>rows.push(['Investment',i.purchaseDate,i.currentValue,i.category,i.name,i.notes||'','','','','']));
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  download(`finplan-export-${todayISO()}.csv`, csv, 'text/csv');
  toast('CSV exported');
}

/* ---------------------------- REMINDERS / NOTIFICATIONS ---------------------------- */
// Fires a notification safely. Uses the active service worker (required for Android PWA
// notifications) once one has actually taken control of the page; otherwise falls back to
// the plain Notification API. Checking `.controller` (not `.ready`) matters: `.ready` is a
// Promise that never resolves if no service worker is ever registered, which would silently
// swallow every reminder forever.
function showAppNotification(title, body, tag){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{
    if('serviceWorker' in navigator && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title, {body, icon:NOTIF_ICON, tag}));
    } else {
      new Notification(title, {body, icon:NOTIF_ICON});
    }
  }catch(e){}
}
function checkReminders(){
  const today = todayISO();
  const key = today;
  DB.notifiedLog[key] = DB.notifiedLog[key] || [];
  const already = new Set(DB.notifiedLog[key]);
  const due = [];
  DB.income.filter(t=>t.category==='Credit Received'&&t.credit&&creditOutstandingTaken(t)>0.01).forEach(t=>{
    const dd = creditNextDueDate(t,'taken');
    if(dd && dd<=today) due.push({id:'c-'+t.id, msg:`Credit due: repay ${t.credit.personName||'lender'} ${fmtMoney(creditOutstandingTaken(t))}`});
  });
  DB.expense.filter(t=>t.category==='Credit Given'&&t.loan&&creditOutstandingGiven(t)>0.01).forEach(t=>{
    const dd = creditNextDueDate(t,'given');
    if(dd && dd<=today) due.push({id:'l-'+t.id, msg:`Lending due: collect from ${t.loan.personName||'borrower'} ${fmtMoney(creditOutstandingGiven(t))}`});
  });
  [...DB.income,...DB.expense].filter(t=>t.reminder&&t.reminder.enabled&&t.reminder.date&&t.reminder.date<=today).forEach(t=>due.push({id:'r-'+t.id, msg:t.reminder.note||`Reminder: ${t.category}`}));
  due.forEach(d=>{
    if(already.has(d.id)) return;
    already.add(d.id);
    showAppNotification('FinPlan', d.msg, d.id);
  });
  DB.notifiedLog[key] = Array.from(already);
  Object.keys(DB.notifiedLog).forEach(k=>{ if(k<today && daysBetween(k,today)>10) delete DB.notifiedLog[k]; });
  saveDB();
}

function init(){

  checkReminders();

async function boot(){
  DB = await loadDB();
  await IDB.set(IDB_STATE_KEY, DB); // persist any migration/backfill from loadDB immediately
  init();
  // Sync engine starts after the first real render so the app is fully usable
  // offline before any network code runs. `applyToDb` lets the engine read/write
  // the live DB object without ever touching Supabase from the UI layer.
  SyncEngine.init(
    { get: ()=>DB, set: (d)=>{ DB=d; saveDBSilent(); } },
    render
  );
  updateSyncPill();
  SyncEngine.onStatusChange(onSyncStatusChange);
}
// Used only by the sync engine when merging pulled-down remote data — persists
// without re-triggering notifyLocalChange (that diff already happened locally
// against what's now stale; the merge itself is the source of truth here).
async function saveDBSilent(){ try{ await IDB.set(IDB_STATE_KEY, DB); }catch(e){} }
boot();
