<style>
/* ============ TOKENS ============ */
:root{
  --accent:#10B981;
  --accent-rgb:16,185,129;
  --accent-2:#6366F1;
  --danger:#F43F5E;
  --warning:#F59E0B;
  --radius:18px;
  --radius-sm:12px;
  --font-display:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B1120; --surface:#141B2D; --surface-2:#1C2438; --surface-3:#242C42;
  --border:#262F45; --text:#F2F4F8; --text-dim:#8B93A7; --text-faint:#5A6478;
  --shadow: 0 10px 30px -12px rgba(0,0,0,0.5);
  --card-grad: linear-gradient(135deg, rgba(var(--accent-rgb),0.22), rgba(99,102,241,0.10));
}
html[data-theme="light"]{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F8FB; --surface-3:#EEF0F5;
  --border:#E4E7EF; --text:#151A26; --text-dim:#66708A; --text-faint:#9AA2B6;
  --shadow: 0 10px 30px -14px rgba(30,41,59,0.22);
  --card-grad: linear-gradient(135deg, rgba(var(--accent-rgb),0.14), rgba(99,102,241,0.07));
}
html[data-theme="amoled"]{
  --bg:#000000; --surface:#0A0A0A; --surface-2:#121212; --surface-3:#1A1A1A;
  --border:#1F1F1F; --text:#F5F5F5; --text-dim:#8A8A8A; --text-faint:#555555;
  --shadow: 0 10px 30px -14px rgba(0,0,0,0.8);
  --card-grad: linear-gradient(135deg, rgba(var(--accent-rgb),0.20), rgba(99,102,241,0.08));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.02em; font-weight:800;}
p{margin:0;}
button{font-family:inherit; cursor:pointer; color:inherit; -webkit-appearance:none; appearance:none; -webkit-text-fill-color:currentColor; background-color:transparent;}
input,select,textarea{font-family:inherit; color:var(--text); -webkit-text-fill-color:currentColor; -webkit-appearance:none; appearance:none;}
a{color:inherit;}
.num{font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-0.01em;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* ============ LAYOUT ============ */
#app{display:flex; min-height:100vh;}
#sidebar{
  display:none; width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  padding:22px 14px; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;
}
#sidebar .brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
#sidebar .brand .mark{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:15px;}
#sidebar .brand .name{font-weight:800; font-size:15px;}
#sidebar .brand .sub{font-size:11px; color:var(--text-dim);}
.nav-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:var(--text-dim); font-size:14px; font-weight:600; border:none; background:transparent; text-align:left; width:100%;}
.nav-item svg{width:18px; height:18px; flex-shrink:0;}
.nav-item.active{background:var(--surface-3); color:var(--text);}
.nav-item.active svg{color:var(--accent);}
.nav-item:hover{color:var(--text);}
#sidebar .side-footer{margin-top:auto; padding:10px; font-size:11px; color:var(--text-faint);}

#main{flex:1; min-width:0; display:flex; flex-direction:column; padding-bottom:88px;}
#topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:14px 16px; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
#topbar h1{font-size:19px;}
#topbar .spacer{flex:1;}
.icon-btn{width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text);}
.icon-btn svg{width:17px; height:17px;}
#view-root{padding:16px; max-width:1100px; width:100%; margin:0 auto;}

#bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; background:var(--surface);
  border-top:1px solid var(--border); padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
#bottomnav .nav-item{flex-direction:column; gap:3px; font-size:10.5px; padding:7px 4px; border-radius:10px;}
#bottomnav .nav-item svg{width:20px; height:20px;}
#bottomnav .nav-item.active{background:transparent;}

.fab{
  position:fixed; right:18px; bottom:78px; z-index:35; width:56px; height:56px; border-radius:18px; border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
}
.fab svg{width:24px; height:24px;}

@media(min-width:900px){
  #sidebar{display:flex;}
  #bottomnav{display:none;}
  #main{padding-bottom:24px;}
  .fab{bottom:26px;}
}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.card-flat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; color:var(--text);}
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(2,1fr);}
@media(min-width:640px){.grid-4{grid-template-columns:repeat(4,1fr);}}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
.section-title h3{font-size:15px;}
.section-title .link{font-size:12.5px; color:var(--accent); font-weight:700; background:none; border:none;}

.stat-card{border-radius:var(--radius); padding:14px; border:1px solid var(--border); background:var(--surface); position:relative; overflow:hidden;}
.stat-card .label{font-size:11.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.stat-card .value{font-size:18px; margin-top:6px;}
.stat-card .delta{font-size:11px; margin-top:4px; font-weight:600;}
.stat-card.accented{background:var(--card-grad);}

.hero-card{
  border-radius:24px; padding:22px; position:relative; overflow:hidden; color:#fff;
  background:linear-gradient(135deg,#0F172A 0%,#111827 45%, var(--accent-2) 160%);
  box-shadow:var(--shadow);
}
.hero-card::after{content:""; position:absolute; inset:0; background:radial-gradient(120% 100% at 100% 0%, rgba(var(--accent-rgb),0.45), transparent 60%);}
.hero-card .eyebrow{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; font-weight:700; position:relative;}
.hero-card .amount{font-size:34px; margin-top:6px; position:relative;}
.hero-card .sub{font-size:12px; opacity:.8; margin-top:6px; position:relative;}
.hero-card .spark{margin-top:10px; position:relative;}
.wallet-strip{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 8px; margin:12px -2px 0; scrollbar-width:none;}
.wallet-strip::-webkit-scrollbar{display:none;}
.wallet-card{
  min-width:150px; border-radius:16px; padding:13px; color:#fff; flex-shrink:0; position:relative; overflow:hidden;
  box-shadow:0 8px 18px -8px rgba(0,0,0,.4);
}
.wallet-card .wname{font-size:12px; font-weight:700; opacity:.9;}
.wallet-card .wbal{font-size:16.5px; margin-top:16px;}
.wallet-card .wtype{font-size:9.5px; opacity:.7; text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

.btn{border-radius:12px; padding:11px 16px; font-weight:700; font-size:13.5px; border:1px solid var(--border); background:var(--surface); color:var(--text); display:inline-flex; align-items:center; gap:8px; justify-content:center;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; color:#fff;}
.btn-danger{background:var(--danger); border:none; color:#fff;}
.btn-ghost{background:transparent; border:1px solid var(--border);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
.btn-block{width:100%;}
.btn:active{transform:scale(.98);}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=tel],.field input[type=time],
.field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px;
}
.field textarea{min-height:64px; resize:vertical;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.checkline{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); font-weight:600;}
.checkline input{width:17px; height:17px;}
.toggle-wrap{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; user-select:none;}
.toggle-wrap .toggle-label{flex:1; font-size:13px; font-weight:700; color:var(--text);}
.toggle-wrap .toggle-sub{font-size:11px; color:var(--text-dim); margin-top:1px;}
.toggle{position:relative; width:44px; height:26px; flex-shrink:0;}
.toggle input{opacity:0; width:0; height:0; position:absolute;}
.toggle-track{position:absolute; inset:0; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); transition:background .22s, border-color .22s;}
.toggle input:checked + .toggle-track{background:var(--accent); border-color:var(--accent);}
.toggle-thumb{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .22s; box-shadow:0 1px 4px rgba(0,0,0,.35); pointer-events:none;}
.toggle input:checked ~ .toggle-thumb{transform:translateX(18px);}
.seg-ctrl{display:flex; border-radius:10px; border:1px solid var(--border); overflow:hidden; background:var(--surface-2);}
.seg-btn{flex:1; padding:8px 4px; font-size:11px; font-weight:700; border:none; background:transparent; color:var(--text-dim); text-align:center; cursor:pointer; border-right:1px solid var(--border);}
.seg-btn:last-child{border-right:none;}
.seg-btn.active{background:var(--text); color:var(--bg);}
fieldset{border:1px dashed var(--border); border-radius:12px; padding:12px; margin:0 0 12px;}
legend{font-size:11.5px; font-weight:700; color:var(--text-dim); padding:0 6px;}

.chip{display:inline-flex; align-items:center; gap:5px; background:var(--surface-3); border-radius:999px; padding:5px 10px; font-size:11.5px; font-weight:600; color:var(--text-dim);}
.chip button{background:none; border:none; color:inherit; padding:0; font-size:12px;}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}

.tx-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border);}
.tx-row:last-child{border-bottom:none;}
.tx-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.tx-mid{flex:1; min-width:0;}
.tx-mid .t1{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tx-mid .t2{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.tx-amt{font-size:13.5px; text-align:right; flex-shrink:0;}
.tx-amt.pos{color:var(--accent);}
.tx-amt.neg{color:var(--danger);}
.tx-row{cursor:pointer;}

.empty{text-align:center; padding:34px 16px; color:var(--text-dim);}
.empty .e-ico{font-size:30px; margin-bottom:8px;}
.empty .e-t{font-weight:700; color:var(--text); font-size:14px;}
.empty .e-s{font-size:12.5px; margin-top:4px;}

.badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;}
.badge.ok{background:rgba(16,185,129,.15); color:var(--accent);}
.badge.warn{background:rgba(245,158,11,.15); color:var(--warning);}
.badge.bad{background:rgba(244,63,94,.15); color:var(--danger);}

.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; font-weight:700;}
.tab-btn.active{background:var(--text); color:var(--bg); border-color:var(--text);}

.searchbar{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
.searchbar input{flex:1; border:none; background:transparent; outline:none; color:var(--text); font-size:14px;}
.searchbar svg{width:16px; height:16px; color:var(--text-dim); flex-shrink:0;}

.swatch{width:26px; height:26px; border-radius:8px; border:2px solid transparent; flex-shrink:0;}
.swatch.selected{border-color:var(--text);}
.swatch-row{display:flex; gap:8px; flex-wrap:wrap;}

.heatmap{display:grid; grid-template-columns:repeat(14,1fr); gap:3px;}
.heat-cell{aspect-ratio:1; border-radius:3px;}

/* ============ MODAL / TOAST ============ */
#modal-layer{position:fixed; inset:0; z-index:100; display:none;}
#modal-layer.open{display:block;}
.modal-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(2px);}
.modal-sheet{
  position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto; background:var(--surface);
  border-radius:22px 22px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); animation:slideUp .22s ease;
  border-top:1px solid var(--border);
}
@media(min-width:640px){
  .modal-sheet{left:50%; bottom:auto; top:50%; transform:translate(-50%,-50%); width:520px; max-width:92vw; border-radius:20px; max-height:86vh;}
  @keyframes slideUp{from{opacity:0; transform:translate(-50%,-46%);} to{opacity:1; transform:translate(-50%,-50%);}}
}
@media(max-width:639px){@keyframes slideUp{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}}
.modal-handle{width:36px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 12px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{font-size:16.5px;}
#toast-layer{position:fixed; left:0; right:0; bottom:calc(94px + env(safe-area-inset-bottom)); z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
@media(min-width:900px){#toast-layer{bottom:24px;}}
.toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:11px; font-size:13px; font-weight:700; box-shadow:var(--shadow); max-width:90vw;}

.sparkle-btn{position:relative;}
.divider{height:1px; background:var(--border); margin:14px 0;}
.muted{color:var(--text-dim);}
.small{font-size:12px;}
.center{text-align:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;}

@media print{
  #sidebar,#bottomnav,#topbar,.fab,#modal-layer,#toast-layer{display:none !important;}
  body{background:#fff; color:#000;}
  #main{padding:0;}
}
.print-only{display:none;}
.sync-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#94A3B8;flex:none}
.sync-pill[data-status="synced"] .sync-dot{background:#10B981}
.sync-pill[data-status="syncing"] .sync-dot{background:#F59E0B;animation:syncPulse 1s infinite}
.sync-pill[data-status="offline"] .sync-dot{background:#64748B}
.sync-pill[data-status="error"] .sync-dot{background:#F43F5E}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------------------------- STORE ----------------------------
   IndexedDB is the primary store (via the IDB helper in sync-engine.js).
   localStorage is only ever read once, to migrate an existing install's
   data into IndexedDB the first time this version runs — nothing here
   writes to localStorage going forward. */
const DB_KEY='finplan_db_v1';
const IDB_STATE_KEY='app_state';
let DB;

function mergeIntoDefaults(parsed){
  const d = defaultDB();
  const merged = Object.assign(d, parsed, {
    accounts: parsed.accounts||d.accounts,
    income: parsed.income||[], expense: parsed.expense||[], investments: parsed.investments||[],
    categoriesIncome: parsed.categoriesIncome||d.categoriesIncome,
    categoriesExpense: parsed.categoriesExpense||d.categoriesExpense,
    settings: Object.assign(d.settings, parsed.settings||{}),
    notifiedLog: parsed.notifiedLog||{},
    txCounter: parsed.txCounter||0
  });
  // One-time additive migration: bring in any new default categories this existing
  // install doesn't have yet, without touching categories the user already customized.
  if(!merged.settings.categoriesV2Migrated){
    DEFAULT_INCOME_CATS.forEach(([name,icon,color])=>{
      if(!merged.categoriesIncome.find(c=>c.name===name)) merged.categoriesIncome.push({id:uid(),name,icon,color,locked:false});
    });
    DEFAULT_EXPENSE_CATS.forEach(([name,icon,color])=>{
      if(!merged.categoriesExpense.find(c=>c.name===name)) merged.categoriesExpense.push({id:uid(),name,icon,color,locked:false});
    });
    merged.settings.categoriesV2Migrated = true;
  }
  // One-time backfill: give every pre-existing transaction a Transaction ID so the
  // whole ledger has traceable IDs going forward, without renumbering on every load.
  if(!merged.settings.txnIdsBackfilled){
    const allTx = [...merged.income, ...merged.expense].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    allTx.forEach(t=>{ if(!t.txnId){ merged.txCounter = (merged.txCounter||0)+1; t.txnId = `TXN-${(t.date||todayISO()).slice(0,4)}-${String(merged.txCounter).padStart(6,'0')}`; } });
    merged.settings.txnIdsBackfilled = true;
  }
  return merged;
}

async function loadDB(){
  try{
    const fromIdb = await IDB.get(IDB_STATE_KEY);
    if(fromIdb) return IdMigration.run(mergeIntoDefaults(fromIdb));
    // Nothing in IndexedDB yet — check localStorage for a pre-existing install (one-time import).
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){ const d=defaultDB(); d.settings.categoriesV2Migrated=true; d.settings.txnIdsBackfilled=true; d.settings.uuidMigrated=true; return d; }
    const parsed = JSON.parse(raw);
    return IdMigration.run(mergeIntoDefaults(parsed));
  }catch(e){ console.error('DB load failed, using defaults', e); return defaultDB(); }
}
async function saveDB(){
  try{
    await IDB.set(IDB_STATE_KEY, DB);
    // Fire-and-forget: tell the sync engine something changed locally so it can
    // diff, queue, and upload in the background. Never blocks the UI.
    SyncEngine.notifyLocalChange(DB);
  }catch(e){ console.error('DB save failed', e); }
}

  n = Number(n)||0;
  const sym = CURRENCIES[DB.settings.currency]||'₹';
  const neg = n<0; n=Math.abs(n);
  const s = n.toLocaleString('en-IN',{maximumFractionDigits:0});
  return (neg?'-':'')+sym+s;
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd=String(d.getDate()).padStart(2,'0'), mm=months[d.getMonth()], yyyy=d.getFullYear();
  const fmt = DB.settings.dateFormat;
  if(fmt==='MM/DD/YYYY') return `${String(d.getMonth()+1).padStart(2,'0')}/${dd}/${yyyy}`;
  if(fmt==='DD/MM/YYYY') return `${dd}/${String(d.getMonth()+1).padStart(2,'0')}/${yyyy}`;
  return `${dd} ${mm} ${yyyy}`;
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addMonths(dateStr, n){ const d=new Date(dateStr); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function advanceDateByPeriod(dateStr, period){
  const d = new Date(dateStr+'T00:00:00');
  switch((period||'monthly').toLowerCase()){
    case 'daily':      d.setDate(d.getDate()+1); break;
    case 'weekly':     d.setDate(d.getDate()+7); break;
    case 'bimonthly':  d.setDate(d.getDate()+14); break;
    case 'monthly':    d.setMonth(d.getMonth()+1); break;
    case 'quarterly':  d.setMonth(d.getMonth()+3); break;
    case 'biannually': d.setMonth(d.getMonth()+6); break;
    case 'annually':   d.setFullYear(d.getFullYear()+1); break;
    case 'one-time':   /* no advance — one-time means fixed end date */ break;
    default:           d.setMonth(d.getMonth()+1);
  }
  return d.toISOString().slice(0,10);
}
function monthKey(iso){ return iso.slice(0,7); }
function isThisMonth(iso){ return monthKey(iso)===monthKey(todayISO()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);}; }
function download(filename, content, mime){
  const blob = new Blob([content],{type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
}
function toast(msg){

/* ---------------------------- CHARTS (pure SVG) ---------------------------- */
function polar(cx,cy,r,deg){ const a=deg*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function arcPath(cx,cy,r,a0,a1,color){
  const [x1,y1]=polar(cx,cy,r,a0), [x2,y2]=polar(cx,cy,r,a1);
  const large = (a1-a0)>180?1:0;
  return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${color}"/>`;
}
function svgDonut(data, size){
  size = size||150; const r=size/2;
  const total = data.reduce((s,d)=>s+Math.max(d.value,0),0);
  if(!total) return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r-3}" fill="none" stroke="var(--border)" stroke-width="14"/></svg>`;
  let angle=-90, paths='';
  data.forEach(d=>{ if(d.value<=0) return; const sweep=(d.value/total)*360; paths+=arcPath(r,r,r-2,angle,angle+sweep,d.color); angle+=sweep; });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${r}" cy="${r}" r="${r*0.58}" fill="var(--surface)"/></svg>`;
}
function svgBars(values, labels, opts){
  opts=opts||{}; const w=opts.width||320,h=opts.height||150,pad=8,bottomPad=20;
  const max = Math.max(...values,1);
  const gap = (w-pad*2)/values.length;
  const bw = gap*0.55;
  let bars='', labs='';
  values.forEach((v,i)=>{
    const bh = Math.max((v/max)*(h-bottomPad-10),v>0?3:0);
    const x = pad+i*gap+(gap-bw)/2, y=h-bottomPad-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${opts.color||'var(--accent)'}"/>`;
    if(labels) labs+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-5}" font-size="8" text-anchor="middle" fill="var(--text-faint)">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${h-bottomPad}" x2="${w-pad}" y2="${h-bottomPad}" stroke="var(--border)"/>${bars}${labs}</svg>`;
}
function svgLine(values, opts){
  opts=opts||{}; const w=opts.width||320,h=opts.height||110,pad=6;
  if(values.length<2) values=[0,...values];
  const max=Math.max(...values,0), min=Math.min(...values,0);
  const range=(max-min)||1;
  const stepX=(w-pad*2)/(values.length-1);
  const pts = values.map((v,i)=>[ (pad+i*stepX).toFixed(1), (h-pad-((v-min)/range)*(h-pad*2)).toFixed(1) ]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `${pad},${h-pad} ${line} ${(w-pad).toFixed(1)},${h-pad}`;
  const color = opts.color||'var(--accent)';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <polygon points="${area}" fill="${color}" opacity="0.15"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function legendRow(items){
  return `<div style="display:flex;flex-direction:column;gap:8px">${items.map(it=>`
    <div class="flex-between" style="font-size:12.5px">
      <span style="display:flex;align-items:center;gap:8px;color:var(--text-dim)"><span style="width:9px;height:9px;border-radius:3px;background:${it.color};display:inline-block"></span>${esc(it.label)}</span>

function accountBalance(accId){
  const acc = DB.accounts.find(a=>a.id===accId); if(!acc) return 0;
  const inc = DB.income.filter(t=>t.accountId===accId).reduce((s,t)=>s+t.amount,0);
  const exp = DB.expense.filter(t=>t.accountId===accId).reduce((s,t)=>s+t.amount,0);
  return (acc.openingBalance||0)+inc-exp;
}
function totalByType(type){
  return DB.accounts.filter(a=>a.type===type).reduce((s,a)=>s+accountBalance(a.id),0);
}
function totalInvestments(){ return DB.investments.filter(i=>!i.closed).reduce((s,i)=>s+(Number(i.currentValue)||0),0); }
function totalInvestedAmount(){ return DB.investments.filter(i=>!i.closed).reduce((s,i)=>s+(Number(i.investedAmount)||0),0); }
function pendingLending(){ return DB.expense.filter(t=>t.category==='Credit Given'&&t.loan).reduce((s,t)=>s+creditOutstandingGiven(t),0); }
function pendingCredits(){ return DB.income.filter(t=>t.category==='Credit Received'&&t.credit).reduce((s,t)=>s+creditOutstandingTaken(t),0); }
function netWorth(){ return totalByType('cash')+totalByType('bank')+totalByType('wallet')+totalInvestments()+pendingLending()-pendingCredits(); }
function isTransfer(t){ return t.category==='Transfer'; }
function isRepayment(t){ return t.category==='Credit Repayment' || t.category==='EMI'; }
function monthIncome(mk){ mk=mk||monthKey(todayISO()); return DB.income.filter(t=>!isTransfer(t)&&monthKey(t.date)===mk).reduce((s,t)=>s+t.amount,0); }
function monthExpense(mk){ mk=mk||monthKey(todayISO()); return DB.expense.filter(t=>!isTransfer(t)&&monthKey(t.date)===mk).reduce((s,t)=>s+t.amount,0); }

function todayExpense(){ return DB.expense.filter(t=>!isTransfer(t)&&t.date===todayISO()).reduce((s,t)=>s+t.amount,0); }

/* ---------------------------- SIGN-IN GATE ---------------------------- */
// Every "add/edit a transaction-type entry" action funnels through one of
// these keys. After a successful sign-in initiated from the gate, the
// matching opener is called automatically so the user lands right back
// where they were headed — including across a Google OAuth redirect
// (full page reload), since the intent is kept in localStorage, not memory.
const AUTH_REQUIRED_INTENTS = {
  'income': ()=>openTxModal('income'),
  'expense': ()=>openTxModal('expense'),
  'invest': ()=>openInvestModal(),
  'transfer': ()=>openTransferModal(),
  'credit-taken': ()=>openCreditModal('taken'),
  'credit-given': ()=>openCreditModal('given'),
};
// Returns true (and lets the caller proceed) if signed in. Otherwise shows
// the sign-in gate and returns false so the caller does nothing else.
// `intent` is only set for "add new" flows — editing an existing entry
// shows the same gate but doesn't try to auto-reopen that specific record
// after login, since the underlying data may change once sync completes.
function requireSignedIn(intent){
  if(SyncEngine.isSignedIn()) return true;
  if(intent && AUTH_REQUIRED_INTENTS[intent]) localStorage.setItem(PENDING_LOGIN_INTENT_KEY, intent);
  else localStorage.removeItem(PENDING_LOGIN_INTENT_KEY);
  showSignInRequiredModal();
  return false;
}
function showSignInRequiredModal(){
  openModal(`
    <div class="modal-head"><h3>${ic('cloud')} Sign in required</h3><button class="icon-btn" data-x>${ic('close')}</button></div>
    <p class="muted small">Transactions can only be added or edited after you sign in, so your data is safely backed up and synced.</p>
    <button class="btn btn-primary btn-block mt20" id="srq-login-btn">${ic('cloud')} Sign in</button>`, root=>{
      root.querySelector('[data-x]').onclick = closeModal;
      root.querySelector('#srq-login-btn').onclick = ()=>{
        closeModal();

        setTimeout(()=>{
          document.getElementById('s-sync-email')?.scrollIntoView({behavior:'smooth', block:'center'});
        }, 150);
      };
    });
}

}
function handlePostLoginRedirect(s){
  if(s !== 'syncing' && s !== 'synced') return;
  const intent = localStorage.getItem(PENDING_LOGIN_INTENT_KEY);
  if(!intent || !AUTH_REQUIRED_INTENTS[intent]) return;
  localStorage.removeItem(PENDING_LOGIN_INTENT_KEY);
  closeModal();
  navigate('dashboard');
  toast('Signed in! Continue where you left off.');
  setTimeout(()=>AUTH_REQUIRED_INTENTS[intent](), 350);
}

/* ---------------------------- DASHBOARD ---------------------------- */
function netWorthHistory(){
  const days=14, out=[];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const inc = DB.income.filter(t=>!isTransfer(t)&&t.date<=iso).reduce((s,t)=>s+t.amount,0);
    const exp = DB.expense.filter(t=>!isTransfer(t)&&t.date<=iso).reduce((s,t)=>s+t.amount,0);
    out.push(inc-exp);
  }
  return out;
}
function upcomingDues(){
  const items = [];
  DB.income.filter(t=>t.category==='Credit Received'&&t.credit).forEach(t=>{
    const outstanding = creditOutstandingTaken(t);
    const dd = creditNextDueDate(t,'taken');
    if(outstanding>0.01 && dd) items.push({label:`Repay ${t.credit.personName||'credit'}`, date:dd, amount:outstanding, kind:'Credit', neg:true});
  });
  DB.expense.filter(t=>t.category==='Credit Given'&&t.loan).forEach(t=>{
    const outstanding = creditOutstandingGiven(t);
    const dd = creditNextDueDate(t,'given');
    if(outstanding>0.01 && dd) items.push({label:`Collect from ${t.loan.personName||'borrower'}`, date:dd, amount:outstanding, kind:'Lending', neg:false});
  });
  [...DB.income,...DB.expense].forEach(t=>{ if(t.reminder&&t.reminder.enabled&&t.reminder.date) items.push({label:t.reminder.note||t.category, date:t.reminder.date, amount:t.amount, kind:'Reminder', neg:t.type==='expense'}); });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items.slice(0,6);
}
function recentTx(){
  return [...DB.income.map(t=>({...t,type:'income'})), ...DB.expense.map(t=>({...t,type:'expense'}))]
    .sort((a,b)=> b.date.localeCompare(a.date)).slice(0,8);
}
function txRowHtml(t){
  const c = catInfo(t.category, t.type);
  const sign = t.type==='income'?'+':'-';
  const cls = t.type==='income'?'pos':'neg';
  return `<div class="tx-row" data-open-tx="${t.type}:${t.id}">
    <div class="tx-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
    <div class="tx-mid"><div class="t1">${esc(t.category)}${t.notes?' · '+esc(t.notes.slice(0,26)):''}</div><div class="t2">${fmtDate(t.date)} · ${esc(accName(t.accountId))}</div></div>
    <div class="tx-amt num ${cls}">${sign}${fmtMoney(t.amount)}</div>
  </div>`;
}

function last6MonthsCashflow(){
  const labels=[], net=[];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const mk = d.toISOString().slice(0,7);
    labels.push(d.toLocaleString('en',{month:'short'}));
    net.push(monthIncome(mk)-monthExpense(mk));
  }
  return {labels,net};
}

function renderTxList(type){
  const filter = type==='income'?state.incomeFilter:state.expenseFilter;
  let list = (type==='income'?DB.income:DB.expense).filter(t=>!isTransfer(t));
  if(filter.cat!=='all') list = list.filter(t=>t.category===filter.cat);
  if(filter.acc && filter.acc!=='all') list = list.filter(t=>t.accountId===filter.acc);
  if(filter.q){
    const q = filter.q.toLowerCase();
    list = list.filter(t=> (t.notes||'').toLowerCase().includes(q) || t.category.toLowerCase().includes(q) ||
      (t.tags||[]).some(tg=>tg.toLowerCase().includes(q)) || accName(t.accountId).toLowerCase().includes(q) ||
      (t.credit&&t.credit.personName&&t.credit.personName.toLowerCase().includes(q)) ||
      (t.loan&&t.loan.personName&&t.loan.personName.toLowerCase().includes(q)));
  }
  const sort = filter.sort||'date_desc';
  if(sort==='date_desc') list.sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
  else if(sort==='date_asc') list.sort((a,b)=> (a.date+a.id).localeCompare(b.date+b.id));
  else if(sort==='amt_desc') list.sort((a,b)=> b.amount-a.amount);
  else if(sort==='amt_asc') list.sort((a,b)=> a.amount-b.amount);
  const el = document.getElementById('tx-list-container');
  if(!el) return;
  el.innerHTML = list.length? list.map(t=>txRowHtml({...t,type})).join('') :
    `<div class="empty"><div class="e-ico">${type==='income'?'💰':'💳'}</div><div class="e-t">No ${type} entries</div><div class="e-s">Try a different filter, or add a new entry.</div></div>`;
  el.querySelectorAll('[data-open-tx]').forEach(b=>b.onclick=()=>{ const [ty,id]=b.dataset.openTx.split(':'); openTxModal(ty,id); });
}
function mountTxView(type){

    (type==='income'?state.incomeFilter:state.expenseFilter).q = e.target.value; renderTxList(type);

}

function openTxModal(type, id){
  if(!requireSignedIn(id ? null : type)) return;
  const isEdit = !!id;
  const existing = isEdit ? (type==='income'?DB.income:DB.expense).find(t=>t.id===id) : null;
  const cats = type==='income'?DB.categoriesIncome:DB.categoriesExpense;
  const defAcc = DB.settings.defaultAccount || (DB.accounts[0]&&DB.accounts[0].id);
  const t = existing || {id:uid(), date:todayISO(), amount:'', accountId:defAcc, category:cats[0]?.name||'Other', notes:'', tags:[], location:'', attachment:null, credit:{personName:'',mobile:'',dueDate:'',paid:false}, loan:{personName:'',mobile:'',dueDate:'',amountReturned:0}, reminder:{enabled:false,date:'',note:''}};

  const html = `
    <div class="modal-head"><h3>${isEdit?'Edit':'Add'} ${type==='income'?'Income':'Expense'}</h3><button class="icon-btn" data-x>${ic('close')}</button></div>

      <div class="field"><label>Date</label><input type="date" id="f-date" value="${t.date}"></div>

    </div>
    <div class="field-row">
      <div class="field"><label>Account / Payment Mode</label>

      </div>
      <div class="field"><label>Category</label>
        <select id="f-category">${cats.map(c=>`<option value="${esc(c.name)}" ${c.name===t.category?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Optional notes…">${esc(t.notes||'')}</textarea></div>
    <div class="field"><label>Tags (comma separated)</label><input type="text" id="f-tags" placeholder="e.g. urgent, family" value="${esc((t.tags||[]).join(', '))}"></div>
    ${type==='expense'?`<div class="field"><label>Location (optional)</label><input type="text" id="f-location" placeholder="e.g. Lucknow" value="${esc(t.location||'')}"></div>`:''}
    <div class="field"><label>Attachment (optional)</label><input type="file" id="f-attach" accept="image/*,.pdf">${t.attachment?`<div class="small muted mt8">📎 ${esc(t.attachment.name)}</div>`:''}</div>

    <div id="credit-fields" style="display:${type==='income'&&t.category==='Credit Received'?'block':'none'}">
      <fieldset><legend>Credit details</legend>
        <div class="field-row"><div class="field"><label>Person name</label><input type="text" id="c-name" value="${esc(t.credit?.personName||'')}"></div><div class="field"><label>Mobile</label><input type="tel" id="c-mobile" value="${esc(t.credit?.mobile||'')}"></div></div>
        <div class="field-row"><div class="field"><label>Due date</label><input type="date" id="c-due" value="${t.credit?.dueDate||''}"></div><div class="field" style="display:flex;align-items:flex-end"><label class="checkline" style="margin-bottom:11px"><input type="checkbox" id="c-paid" ${t.credit?.paid?'checked':''}> Repaid</label></div></div>
      </fieldset>
    </div>
    <div id="loan-fields" style="display:${type==='expense'&&t.category==='Credit Given'?'block':'none'}">
      <fieldset><legend>Lending details</legend>
        <div class="field-row"><div class="field"><label>Person name</label><input type="text" id="l-name" value="${esc(t.loan?.personName||'')}"></div><div class="field"><label>Mobile</label><input type="tel" id="l-mobile" value="${esc(t.loan?.mobile||'')}"></div></div>

      </fieldset>
    </div>

      <legend>Reminder</legend>

      if(type==='expense') root.querySelector('#loan-fields').style.display = e.target.value==='Credit Given'?'block':'none';

        if(isCreditTaken) DB.expense = DB.expense.filter(x=>x.linkedCreditId!==id);
        if(isCreditGiven) DB.income = DB.income.filter(x=>x.linkedCreditId!==id);
        // Bug fix: deleting a linked repayment/EMI/collection transaction directly from this
        // basic list (rather than via Credit Detail's own delete-payment button) must also
        // remove it from the parent credit/loan's payments[] history and recompute outstanding/
        // installments — otherwise the credit record silently goes stale and keeps showing an
        // outstanding balance and EMI count that no longer match the actual transactions.
        if(isLinkedRepayment){
          const parentTaken = DB.income.find(x=>x.id===existing.linkedCreditId && x.credit);
          const parentGiven = DB.expense.find(x=>x.id===existing.linkedCreditId && x.loan);
          if(parentTaken){
            const info2 = parentTaken.credit;
            info2.payments = (info2.payments||[]).filter(p=>p.txnId!==existing.txnId);
            if(info2.isEMI && info2.installmentsPaid>0) info2.installmentsPaid -= 1;
            const uf = creditFinancials(parentTaken, 'taken');
            info2.paid = uf.settled; info2.amountRepaid = uf.paidTotal; info2.pendingAmount = uf.outstanding;
          } else if(parentGiven){
            const info2 = parentGiven.loan;
            info2.payments = (info2.payments||[]).filter(p=>p.txnId!==existing.txnId);
            const uf = creditFinancials(parentGiven, 'given');
            info2.amountReturned = uf.paidTotal; info2.pendingAmount = uf.outstanding;
          }
        }
        saveDB(); closeModal(); toast('Deleted'); render();
      };
    }
    root.querySelector('#f-save').onclick = ()=>{
      const amount = parseFloat(root.querySelector('#f-amount').value);
      if(!amount || amount<=0){ toast('Enter a valid amount'); return; }
      const category = root.querySelector('#f-category').value;
      const newT = {
        id: t.id, type, date: root.querySelector('#f-date').value||todayISO(), amount,
        accountId: root.querySelector('#f-account').value, category,
        notes: root.querySelector('#f-notes').value.trim(),
        tags: root.querySelector('#f-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
        attachment,
        reminder: {enabled: root.querySelector('#r-enabled').checked, date: root.querySelector('#r-date').value, note: root.querySelector('#r-note').value.trim()}
      };
      if(existing && existing.linkedInvestmentId) newT.linkedInvestmentId = existing.linkedInvestmentId;
      if(existing && existing.realizedPL!==undefined) newT.realizedPL = existing.realizedPL;
      // Bug fix: these two link a transaction back to another record (a credit/loan repayment,
      // or the other leg of a transfer). Without carrying them over, editing and saving via this
      // basic form would silently sever the link.
      if(existing && existing.linkedCreditId) newT.linkedCreditId = existing.linkedCreditId;
      if(existing && existing.transferPairId) newT.transferPairId = existing.transferPairId;
      if(type==='expense'){
        newT.location = root.querySelector('#f-location').value.trim();
        if(category==='Credit Given'){
          const returned = parseFloat(root.querySelector('#l-returned').value)||0;
          newT.loan = {personName:root.querySelector('#l-name').value.trim(), mobile:root.querySelector('#l-mobile').value.trim(), dueDate:root.querySelector('#l-due').value, amountReturned:returned, pendingAmount: Math.max(amount-returned,0)};
        } else if(existing) { newT.loan = existing.loan; }
      }
      if(type==='income'){
        if(category==='Credit Received'){
          // Bug fix 8: merge editable surface fields into existing credit object to preserve
          // payments[], interest, isEMI, emiAmount, tenureMonths, installmentsPaid, etc.
          const editedCredit = {
            personName: root.querySelector('#c-name').value.trim(),
            mobile: root.querySelector('#c-mobile').value.trim(),
            dueDate: root.querySelector('#c-due').value,
            paid: root.querySelector('#c-paid').checked
          };
          newT.credit = existing && existing.credit
            ? Object.assign({}, existing.credit, editedCredit)
            : editedCredit;
        } else if(existing) { newT.credit = existing.credit; }
      }
      const arr = type==='income'?DB.income:DB.expense;
      const idx = arr.findIndex(x=>x.id===t.id);
      if(idx===-1) newT.txnId = genTxnId(); else if(existing && existing.txnId) newT.txnId = existing.txnId;
      const isNewInvestExpense = type==='expense' && EXP_TO_INVEST_CAT[category] && !(existing && existing.category===category);
      if(idx>-1) arr[idx]=newT; else arr.push(newT);
      // Bug fix: if this transaction IS a linked repayment/EMI/collection entry (has
      // linkedCreditId), amount/date/account changes made here must also update the matching
      // entry in the parent credit/loan's payments[] history and recompute outstanding —
      // otherwise the credit record silently drifts from the actual transaction.
      if(newT.linkedCreditId){
        const parentTaken = DB.income.find(x=>x.id===newT.linkedCreditId && x.credit);
        const parentGiven = DB.expense.find(x=>x.id===newT.linkedCreditId && x.loan);
        const parent = parentTaken || parentGiven;
        if(parent){
          const info2 = parentTaken ? parentTaken.credit : parentGiven.loan;
          const p = (info2.payments||[]).find(pp=>pp.txnId===newT.txnId);
          if(p){ p.amount = newT.amount; p.date = newT.date; p.accountId = newT.accountId; }
          const uf = creditFinancials(parent, parentTaken?'taken':'given');
          if(parentTaken){ info2.paid=uf.settled; info2.amountRepaid=uf.paidTotal; info2.pendingAmount=uf.outstanding; }
          else { info2.amountReturned=uf.paidTotal; info2.pendingAmount=uf.outstanding; }
        }
      }
      saveDB(); closeModal(); toast('Saved');
      if(isNewInvestExpense){ promptLinkInvestment(newT); } else { render(); }
    };
  });
}

/* ---------------------------- CREDIT MANAGEMENT ---------------------------- */
/* ---------------------------- INTEREST / EMI MATH ---------------------------- */
// Counts how many whole billing periods have elapsed between two ISO dates.
function periodsElapsed(fromStr, toStr, period){
  if(!fromStr || !toStr) return 0;
  const from = new Date(fromStr+'T00:00:00'), to = new Date(toStr+'T00:00:00');
  if(to<=from) return 0;
  const days = Math.floor((to-from)/86400000);
  const monthsBetween = ()=>{
    let m = (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth());
    if(to.getDate()<from.getDate()) m--;
    return Math.max(m,0);
  };
  switch((period||'monthly').toLowerCase()){
    case 'daily':      return days;
    case 'weekly':     return Math.floor(days/7);
    case 'bimonthly':  return Math.floor(days/14);
    case 'monthly':    return monthsBetween();
    case 'quarterly':  return Math.floor(monthsBetween()/3);
    case 'biannually': return Math.floor(monthsBetween()/6);
    case 'annually': {
      let y = to.getFullYear()-from.getFullYear();
      if(to.getMonth()<from.getMonth() || (to.getMonth()===from.getMonth() && to.getDate()<from.getDate())) y--;
      return Math.max(y,0);
    }
    case 'one-time':   return days>0 ? 1 : 0;
    default:           return monthsBetween();
  }
}
// Standard EMI formula on a periodic (already per-installment) rate.
function calcEMI(principal, ratePercentPerPeriod, tenure){
  principal = Number(principal)||0; tenure = Number(tenure)||0;
  if(tenure<=0) return 0;
  const r = (Number(ratePercentPerPeriod)||0)/100;
  if(!r) return principal/tenure;
  const factor = Math.pow(1+r, tenure);
  return principal*r*factor/(factor-1);
}
// Simulates a reducing/flat balance over its payment history to get live interest,
// total amount (principal+interest) and outstanding due as of a given date.
// Payments are applied interest-first, then to principal — standard loan behaviour.
function computeCreditFinancials(principal, interest, startDate, payments, asOfDate){
  principal = Number(principal)||0;
  asOfDate = asOfDate || todayISO();
  payments = (payments||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!interest || !interest.rate){
    const paidTotal = payments.reduce((s,p)=>s+p.amount,0);
    const outstanding = Math.max(principal-paidTotal,0);
    return {principal, interestAccrued:0, totalAmount:principal, paidTotal, outstanding, outstandingPrincipal:outstanding, unpaidInterest:0, settled:outstanding<=0.01};
  }
  let outstandingPrincipal = principal, unpaidInterest = 0, totalInterestAccrued = 0, lastDate = startDate, oneTimeApplied = false;
  function accrue(uptoDate){
    if(outstandingPrincipal<=0.01) return;
    if((interest.period||'').toLowerCase()==='one-time'){
      if(oneTimeApplied) return;
      if(periodsElapsed(lastDate, uptoDate, 'one-time')<=0) return;
      const amt = interest.type==='flat_amount' ? interest.rate
        : interest.type==='flat_rate' ? principal*interest.rate/100
        : outstandingPrincipal*interest.rate/100;
      unpaidInterest += amt; totalInterestAccrued += amt; oneTimeApplied = true; lastDate = uptoDate;
      return;
    }
    const periods = periodsElapsed(lastDate, uptoDate, interest.period);
    if(periods<=0) return;
    const amt = interest.type==='flat_amount' ? interest.rate*periods
      : interest.type==='flat_rate' ? principal*interest.rate/100*periods
      : outstandingPrincipal*interest.rate/100*periods; // reducing balance
    unpaidInterest += amt; totalInterestAccrued += amt; lastDate = uptoDate;
  }
  for(const p of payments){
    accrue(p.date);
    let amt = p.amount;
    const interestPay = Math.min(amt, unpaidInterest); unpaidInterest -= interestPay; amt -= interestPay;
    const principalPay = Math.min(amt, outstandingPrincipal); outstandingPrincipal -= principalPay;
  }
  accrue(asOfDate);
  const outstanding = Math.max(outstandingPrincipal+unpaidInterest, 0);
  const paidTotal = payments.reduce((s,p)=>s+p.amount,0);
  const totalAmount = principal+totalInterestAccrued;
  return {principal, interestAccrued:totalInterestAccrued, totalAmount, paidTotal, outstanding, outstandingPrincipal, unpaidInterest, settled:outstanding<=0.01};
}
// Unified financial breakdown for a credit-taken/credit-given transaction.
function creditFinancials(t, direction){
  const isTaken = direction==='taken';
  const info = isTaken ? t.credit : t.loan;
  if(!info) return {principal:0, interestAccrued:0, totalAmount:0, paidTotal:0, outstanding:0, settled:true};
  const principal = t.amount;
  let payments = info.payments||[];
  // Back-compat: entries edited via the basic transaction form (not the credit modal)
  // may only have a legacy amountReturned/paid flag with no payments[] history.
  if(!payments.length){
    if(isTaken && info.paid) payments = [{date:t.date, amount:principal}];
    else if(!isTaken && info.amountReturned>0) payments = [{date:t.date, amount:info.amountReturned}];
  }
  if(isTaken && info.isEMI){
    const totalAmount = (info.emiAmount||0)*(info.tenureMonths||0);
    const paidTotal = payments.reduce((s,p)=>s+p.amount,0);
    const outstanding = Math.max(totalAmount-paidTotal,0);
    return {principal, interestAccrued:Math.max(totalAmount-principal,0), totalAmount, paidTotal, outstanding, settled:outstanding<=0.01};
  }
  return computeCreditFinancials(principal, info.interest, t.date, payments, todayISO());
}
// The day-of-month (1-28) an EMI installment for the `installmentIndex`-th (0-based)
// unpaid EMI falls due, counting months forward from the loan's start date. The first EMI
// is always due one month after disbursal, matching standard EMI convention.
function emiDueDateForInstallment(startDate, emiDueDay, installmentIndex){
  const day = Math.min(Math.max(parseInt(emiDueDay)||1,1),28);
  const d = new Date((startDate||todayISO())+'T00:00:00');
  d.setDate(1);
  d.setMonth(d.getMonth()+installmentIndex+1);
  d.setDate(day);
  return d.toISOString().slice(0,10);
}
// Returns the next date an amount is actually due for a credit-taken/credit-given record, for
// reminders and the upcoming-dues list. For EMI loans this is derived from emiDueDay + how many
// installments are already paid (not a stored/mutated date) — the stored `dueDate` on an EMI
// loan is the final loan-end date and never drives reminders. Falls back to the stored dueDate
// for EMI loans created before emiDueDay existed, and for all non-EMI credit/lending records.
function creditNextDueDate(t, direction){
  const isTaken = direction==='taken';
  const info = isTaken ? t.credit : t.loan;
  if(!info) return null;
  if(isTaken && info.isEMI){
    const paid = info.installmentsPaid||0;
    if(paid>=(info.tenureMonths||0)) return null;
    if(!info.emiDueDay) return info.dueDate||null;
    return emiDueDateForInstallment(t.date, info.emiDueDay, paid);
  }
  return info.dueDate||null;
}
function creditOutstandingTaken(t){ return t.credit ? creditFinancials(t,'taken').outstanding : 0; }
function creditOutstandingGiven(t){ return t.loan ? creditFinancials(t,'given').outstanding : 0; }
function creditTakenList(){ return DB.income.filter(t=>t.category==='Credit Received' && t.credit); }
function creditGivenList(){ return DB.expense.filter(t=>t.category==='Credit Given' && t.loan); }

function renderCreditList(){
  const el = document.getElementById('credit-list'); if(!el) return;
  const tab = state.creditTab;
  const list = tab==='taken' ? creditTakenList() : creditGivenList();
  const sorted = [...list].sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML = sorted.length? sorted.map(t=>{
    const person = tab==='taken' ? t.credit.personName : t.loan.personName;
    const isEMI = tab==='taken' && t.credit.isEMI;
    // Bug fix: this list must show the next EMI due date (creditNextDueDate), not the raw
    // dueDate — for EMI loans dueDate is now the far-off loan end date, so using it here made
    // EMI rows show a date years away instead of the actual upcoming installment.
    const due = creditNextDueDate(t, tab);
    const fin = creditFinancials(t, tab);
    const outstanding = fin.outstanding;
    const settled = outstanding<=0.01;
    const hasInterest = !!(tab==='taken' ? t.credit.interest : t.loan.interest) || isEMI;
    const amtLabel = hasInterest ? `${fmtMoney(fin.totalAmount)} total` : fmtMoney(t.amount);
    const overdue = !settled && due && due < todayISO();
    return `<div class="tx-row" data-open-credit="${tab}:${t.id}">
      <div class="tx-icon" style="background:${settled?'var(--accent)22':overdue?'var(--danger)33':'var(--danger)22'};color:${settled?'var(--accent)':'var(--danger)'}">${settled?'✅':(isEMI?'🏦':'🤝')}</div>
      <div class="tx-mid"><div class="t1">${esc(person||'Unnamed')}${isEMI?` · EMI ${t.credit.installmentsPaid||0}/${t.credit.tenureMonths}`:''}</div>
        <div class="t2">${amtLabel} · ${due?(overdue?`<span style="color:var(--danger);font-weight:700">⚠ Overdue since ${fmtDate(due)}</span>`:(isEMI?'Next EMI ':'Due ')+fmtDate(due)):'No due date'}</div>
      </div>
      <div style="text-align:right">
        <div class="tx-amt num" style="color:${settled?'var(--text-dim)':overdue?'var(--danger)':'inherit'}">${settled?'Settled':fmtMoney(outstanding)}</div>
        ${!settled?`<div class="small" style="color:${overdue?'var(--danger)':'var(--text-dim)'}">${overdue?'OVERDUE':'Outstanding'}</div>`:''}
      </div></div>`;
  }).join('') : `<div class="empty"><div class="e-ico">🤝</div><div class="e-t">No ${tab==='taken'?'borrowed':'lent'} credit yet</div><div class="e-s">Tap Add to record ${tab==='taken'?'money you borrowed':'money you lent'}.</div></div>`;
  el.querySelectorAll('[data-open-credit]').forEach(b=>b.onclick=()=>{ const [ty,id]=b.dataset.openCredit.split(':'); openCreditDetail(ty,id); });
}
